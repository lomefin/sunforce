<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SunForce</title>
<style>
  :root {
    --sf-ink: #0b0910;
    --sf-gold: #C6973F;
    --sf-red: #A31627;
    --sf-bone: #EDE7DC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--sf-ink);
    color: var(--sf-bone);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; display: grid; place-items: center; }
  /* The canvas letterboxes itself; the shell just centers it. */
  #game {
    display: block;
    max-width: 100vw; max-height: 100vh;
    image-rendering: auto;
    background: #000;
    touch-action: none;
  }
  #boot {
    position: fixed; inset: 0;
    display: grid; place-content: center; justify-items: center; gap: 1.1rem;
    background:
      radial-gradient(120% 90% at 50% 0%, #2a1630 0%, #120b18 55%, #07050a 100%);
    letter-spacing: .34em;
    text-transform: uppercase;
    transition: opacity .5s ease;
    z-index: 10;
  }
  #boot[hidden] { display: none; }
  #boot.fade { opacity: 0; pointer-events: none; }
  #boot h1 {
    margin: 0; font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 800;
    letter-spacing: .18em;
    background: linear-gradient(175deg, #FFE9AE 0%, var(--sf-gold) 45%, var(--sf-red) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 24px rgba(198,151,63,.35));
  }
  #boot p { margin: 0; font-size: .7rem; opacity: .55; }
  #boot .bar { width: min(300px, 60vw); height: 2px; background: rgba(237,231,220,.12); overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 30%; background: var(--sf-gold);
    animation: sweep 1.05s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes sweep { 0% { transform: translateX(-100%) } 100% { transform: translateX(400%) } }
  @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100% } }
  #fatal {
    position: fixed; inset: 0; z-index: 20; display: none;
    place-content: center; justify-items: center; gap: .8rem; padding: 2rem;
    background: #0b0910; text-align: center;
  }
  #fatal.show { display: grid; }
  #fatal h2 { margin: 0; color: var(--sf-red); letter-spacing: .1em; }
  #fatal pre {
    max-width: 90vw; max-height: 40vh; overflow: auto; text-align: left;
    font-size: .75rem; opacity: .7; background: #000; padding: 1rem; border-radius: 6px;
  }
</style>
</head>
<body>
  <div id="app">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>

  <div id="boot">
    <h1>SunForce</h1>
    <p>Altiplano</p>
    <div class="bar"><i></i></div>
  </div>

  <div id="fatal">
    <h2>SunForce failed to start</h2>
    <pre id="fatal-msg"></pre>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
